name: Flutter checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - run: flutter build apk --debug

  android-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Reserve space for the Android emulator
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        shell: bash
        run: |
          df -h /
          # Only unused SDKs on this disposable GitHub-hosted runner.
          # Keep Android, Java, Flutter, Gradle and the workspace intact.
          sudo rm -rf -- /usr/share/dotnet /usr/share/swift /usr/local/.ghcup
          df -h /
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Allow runner access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          disable-animations: true
          pre-emulator-launch-script: df -h /
          script: |
            flutter test integration_test/ai_planning_test.dart -d emulator-5554 --no-uninstall --reporter expanded
            flutter test integration_test/session_flow_test.dart -d emulator-5554 --no-uninstall --reporter expanded
            flutter test integration_test/process_restart_test.dart -d emulator-5554 --no-uninstall --dart-define=NEXTSTEP_RESTART_PHASE=seed --reporter expanded
            adb -s emulator-5554 shell am force-stop dev.tyago.nextstep.integration
            flutter test integration_test/process_restart_test.dart -d emulator-5554 --no-uninstall --dart-define=NEXTSTEP_RESTART_PHASE=verify --reporter expanded
      - name: Diagnose disk space after a failure
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: |
          df -h /
          for directory in "$ANDROID_HOME" "$HOME/.android/avd" "$GITHUB_WORKSPACE/build" "$HOME/.gradle"; do
            if [[ -d "$directory" ]]; then
              du -sh "$directory"
            fi
          done
